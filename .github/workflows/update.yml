name: update-news

on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch calendar and news
        run: |
          python fetch_news.py || true
          echo "--- 结果 ---"
          python -c "
import json
d=json.load(open('data.json',encoding='utf-8'))
print('更新时间:', d['updated'])
print('统计:', d['counts'])
" || echo "data.json 未生成"

      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data.json cache_calendar.json 2>/dev/null || git add data.json
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: update data $(date -u +%H:%M) [skip ci]"
            git push
          fi
