name: update-news

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch calendar and news
        run: python fetch_news.py || true

      - name: Show result
        run: python -c "import json;d=json.load(open('data.json',encoding='utf-8'));print('updated',d['updated']);print('counts',d['counts'])" || echo "no data.json"

      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data.json || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update data [skip ci]"
            git push
          fi
